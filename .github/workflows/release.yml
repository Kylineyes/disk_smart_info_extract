name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify
        run: |
          gofmt -d cmd internal
          test -z "$(gofmt -d cmd internal)"
          go vet ./...
          go test -race -count=1 ./...

      - name: Build Linux amd64 binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' \
            -o dist/smart-log-importer-linux-amd64 \
            ./cmd/smart-log-importer
          file dist/smart-log-importer-linux-amd64
          file dist/smart-log-importer-linux-amd64 | grep -E 'ELF 64-bit.*x86-64'
          sha256sum dist/smart-log-importer-linux-amd64 > dist/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              dist/smart-log-importer-linux-amd64 \
              dist/SHA256SUMS \
              --clobber
          else
            gh release create "$TAG_NAME" \
              dist/smart-log-importer-linux-amd64 \
              dist/SHA256SUMS \
              --verify-tag \
              --generate-notes \
              --title "$TAG_NAME"
          fi
